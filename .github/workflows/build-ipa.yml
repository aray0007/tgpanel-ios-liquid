name: Build TG Panel iOS 26 IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build and Archive
        run: |
          xcodebuild -project TGPanelApp.xcodeproj \
            -scheme TGPanelApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/TGPanelApp.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          cp -r build/TGPanelApp.xcarchive/Products/Applications/TGPanelApp.app Payload/
          zip -r -9 TGPanel_iOS26.ipa Payload
          ls -lh TGPanel_iOS26.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TGPanel_iOS26_IPA
          path: TGPanel_iOS26.ipa